<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:402px;height:874px;overflow:hidden;background:#dbe6ff}
#phone{position:relative;width:402px;height:874px;overflow:hidden;background:#dbe6ff}
.scene{position:absolute;inset:0;overflow:hidden;background:#dbe6ff;will-change:transform,opacity}
.scene img{display:block}
.head{position:absolute;left:0;top:0;width:402px;z-index:3}
.scroller{position:absolute;left:0;right:0;overflow:hidden}
.inner{position:relative;width:402px;will-change:transform}
.inner img{width:402px;height:auto}
.foot{position:absolute;left:0;bottom:0;width:402px;z-index:3;pointer-events:none}
.plain img{position:absolute;left:0;top:0;width:402px;height:auto}
#taps{position:absolute;inset:0;z-index:50;pointer-events:none}
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,92,138,.55);box-shadow:0 0 0 2px rgba(255,255,255,.7);opacity:0}
</style></head>
<body><div id="phone"><div id="taps"></div></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eO=x=>1-Math.pow(1-x,3);
const IMG='../../public/images/';
const NAV_Y=834, TABS={dash:55,disc:132,friends:280,profile:356}, PLUS=[201,797];

/* Each scene is one app screen. `scroll` moves its body (as a fraction of the scrollable distance),
   `taps` are {t, x, y} in the source image's pixels (or {fixed:true} for the pinned header and nav bar). */
const S=[
 {id:'onb1',img:'onboarding-1',plain:true,start:0,end:2.0,enter:'fade',taps:[{t:1.5,x:201,y:774}]},
 {id:'onb2',img:'onboarding-2',plain:true,start:2.0,end:3.9,enter:'slide',taps:[{t:3.4,x:201,y:774}]},
 {id:'onb3',img:'onboarding-3',plain:true,start:3.9,end:5.8,enter:'slide',taps:[{t:5.3,x:201,y:774}]},
 {id:'onb4',img:'onboarding-4',plain:true,start:5.8,end:7.7,enter:'slide',taps:[{t:7.2,x:201,y:774}]},
 {id:'signup',img:'onboarding-5',plain:true,start:7.7,end:10.0,enter:'fade',taps:[{t:9.4,x:201,y:640}]},
 {id:'dash',img:'home-1',start:10.0,end:15.0,enter:'fade',head:101,nav:80,
   scroll:[[10.9,12.4,.55],[12.8,13.7,0]],taps:[{t:14.4,x:150,y:390}]},
 {id:'detail',img:'home-4',start:15.0,end:20.4,enter:'fade',head:101,nav:80,
   scroll:[[15.6,18.0,1]],taps:[{t:18.7,x:200,y:1681},{t:19.8,fixed:true,x:TABS.disc,y:NAV_Y}]},
 {id:'list',img:'home-2',start:20.4,end:24.3,enter:'fade',head:101,nav:80,
   scroll:[[21.0,22.6,.45],[22.8,23.4,0]],taps:[{t:23.9,x:349,y:202}]},
 {id:'map',img:'home-3',start:24.3,end:27.6,enter:'fade',head:100,nav:79,
   scroll:[],taps:[{t:26.9,fixed:true,x:PLUS[0],y:PLUS[1]}]},
 {id:'create',img:'home-5',plain:true,scrollable:true,start:27.6,end:31.6,enter:'fade',
   scroll:[[28.1,30.1,.85],[30.3,30.8,0]],taps:[{t:31.1,x:360,y:53}]},
 {id:'friends',img:'social-1',start:31.6,end:35.6,enter:'fade',head:101,nav:80,
   scroll:[[32.2,33.6,.5],[33.9,34.4,0]],taps:[{t:35.1,x:55,y:162}]},
 {id:'sarah',img:'social-3',start:35.6,end:40.1,enter:'fade',head:88,nav:69,
   scroll:[[36.2,38.6,.7]],taps:[{t:39.6,fixed:true,x:TABS.profile,y:NAV_Y}]},
 {id:'alex',img:'social-4',start:40.1,end:44.5,enter:'fade',head:88,nav:69,
   scroll:[[40.6,42.6,.6],[42.8,43.4,0]],taps:[{t:44.0,fixed:true,x:368,y:66}]},
 {id:'settings',img:'social-5',start:44.5,end:47.6,enter:'fade',head:101,nav:80,
   scroll:[[45.1,46.3,1]],taps:[{t:47.1,fixed:true,x:TABS.profile,y:NAV_Y}]},
 {id:'noshow',img:'social-6',start:47.6,end:51.2,enter:'fade',head:101,nav:80,
   scroll:[[48.3,50.2,1]],taps:[]},
];
const DURATION=51.2;

const phone=document.getElementById('phone'), tapsEl=document.getElementById('taps');
for(const s of S){
  const el=document.createElement('div');el.className='scene'+(s.plain?' plain':'');el.id=s.id;
  const base=IMG+'playmate-app-'+s.img;
  if(s.plain&&!s.scrollable){ el.innerHTML=`<img src="${base}.webp">`; }
  else if(s.plain){ el.innerHTML=`<div class="scroller" style="top:0;bottom:0"><div class="inner"><img src="${base}.webp"></div></div>`; }
  else el.innerHTML=`<img class="head" src="${base}-head.webp"><div class="scroller" style="top:0;bottom:0"><div class="inner" style="padding-top:var(--ht)"><img src="${base}.webp"><div class="pad"></div></div></div><img class="foot" src="${base}-foot.webp">`;
  phone.insertBefore(el,tapsEl);s.el=el;
}
const loaded=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r)));
let ready=false;
loaded.then(()=>{
  for(const s of S){
    s.maxScroll=0;const img0=s.el.querySelector('img:not(.head):not(.foot)');s.sc=402/img0.naturalWidth;
    const inner=s.el.querySelector('.inner');if(!inner)continue;
    const img=inner.querySelector('img');const sc=402/img.naturalWidth;
    if(s.plain){s.maxScroll=Math.max(0,img.naturalHeight*sc-874);continue;}
    const ht=s.head*sc, np=s.nav*sc;
    inner.style.paddingTop=ht+'px';
    inner.querySelector('.pad').style.height=np+'px';
    s.maxScroll=Math.max(0,ht+img.naturalHeight*sc+np-874);
    s.sc=sc;s.ht=ht;
  }
  ready=true;
});

function scrollAt(s,t){ // fraction of the scrollable distance, interpolated through the scene's moves
  let f=0;for(const [a,b,to] of (s.scroll||[])){ if(t>=b){f=to;continue} if(t>a){f=f+(to-f)*eIO(clamp((t-a)/(b-a)))} break; }
  return f;
}
function render(t){
  S.forEach((s,i)=>{
    const el=s.el, dur=.3;
    const p=clamp((t-s.start)/dur);
    const visible=t>=s.start-.001 && t<s.end+.45;
    el.style.display=visible?'block':'none';
    if(!visible)return;
    el.style.zIndex=i+1;
    if(s.enter==='slide'&&i>0){
      el.style.opacity=1;el.style.transform=`translateX(${(1-eO(p))*402}px)`;
    }else{
      el.style.transform='none';el.style.opacity=i===0?1:eO(p);
    }
    // the screen underneath a slide drifts left a little
    const nx=S[i+1];
    if(nx&&nx.enter==='slide'){const q=clamp((t-nx.start)/dur);el.style.transform=`translateX(${-eO(q)*80}px)`;}
    const inner=el.querySelector('.inner');
    if(inner&&ready){inner.style.transform=`translateY(${-scrollAt(s,t)*s.maxScroll}px)`;}
  });
  // tap markers
  const taps=[];
  for(const s of S)for(const tp of (s.taps||[]))taps.push([s,tp]);
  while(tapsEl.children.length<taps.length){const d=document.createElement('div');d.className='tap';tapsEl.appendChild(d);}
  taps.forEach(([s,tp],k)=>{
    const d=tapsEl.children[k];const dt=t-tp.t;
    if(dt<-.02||dt>.55){d.style.opacity=0;return;}
    let x,y;
    if(tp.fixed){x=tp.x;y=tp.y;}
    else{const sc=s.sc||402/(s.el.querySelector('img:not(.head):not(.foot)').naturalWidth);x=tp.x*sc;y=tp.y*sc-(ready?scrollAt(s,tp.t)*s.maxScroll:0);}
    const q=clamp(dt/.5);
    d.style.left=x+'px';d.style.top=y+'px';
    d.style.transform=`scale(${.55+.75*eO(q)})`;
    d.style.opacity=(dt<.08?clamp(dt/.08):1-clamp((dt-.08)/.47))*.95;
  });
}
window.render=render;window.DURATION=DURATION;window.whenReady=()=>loaded;
</script></body></html>
