.mono-display{font-family:var(--font-mono);font-size:36px;line-height:42px;font-weight:700;}
.mono-title{font-family:var(--font-mono);font-size:22px;line-height:28px;font-weight:700;}
.mono-heading{font-family:var(--font-mono);font-size:17px;line-height:24px;font-weight:600;}
.mono-body{font-family:var(--font-mono);font-size:15px;line-height:22px;font-weight:400;}
.mono-label{font-family:var(--font-mono);font-size:13px;line-height:18px;font-weight:500;letter-spacing:0.02em;}
.mono-button{font-family:var(--font-mono);font-size:16px;line-height:20px;font-weight:600;}
.mono-clue{font-family:var(--font-mono);font-size:11px;line-height:12px;font-weight:500;}
.mono-caption{font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:400;}
.puzzle-letter{font-family:var(--font-letters);font-size:36px;line-height:36px;font-weight:400;}
/* WordCross components. Thin clean lines, mono type, purple acts, blue writes. */
.wc-written { color: var(--written); }
.wc-icon, .wc-star, .wc-mascot, .wc-illo { flex: none; }
.wc-star { fill: none; stroke: var(--ink-faint); stroke-width: 1.5; }
.wc-star--on { fill: var(--warning); stroke: var(--ink); }

/* surface */
.wc-sketch { position: relative; box-sizing: border-box; font-family: var(--font-mono); color: var(--ink); background: var(--paper-raised); border: var(--stroke-hair, 1px) solid var(--ink-faint); border-radius: var(--radius-lg, 24px); }
.wc-sketch--lift { box-shadow: var(--lift-md); }
.wc-sketch--sm { border-radius: var(--radius-md, 16px); box-shadow: var(--lift-sm); }

/* Button */
.wc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; min-height: 52px; padding: 12px 24px; border: var(--stroke-md, 1.5px) solid var(--ink); border-radius: var(--radius-md, 16px); background: var(--paper-raised); color: var(--ink); font: 600 16px/20px var(--font-mono); cursor: pointer; }
.wc-btn--block { display: flex; width: 100%; }
.wc-btn--primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.wc-btn--ghost { background: transparent; border-color: transparent; color: var(--primary); text-decoration: underline; text-underline-offset: 4px; }
.wc-btn:active { transform: translateY(1px); }
.wc-btn:focus-visible { outline: var(--stroke-bold, 2px) solid var(--ink); outline-offset: 3px; }
.wc-btn:disabled { cursor: not-allowed; color: var(--ink-muted); background: var(--paper-sunken); border: var(--stroke-hair, 1px) dashed var(--ink-faint); }

/* CoinPill + tag */
.wc-coin { display: inline-flex; align-items: center; gap: 8px; box-sizing: border-box; padding: 6px 16px 6px 8px; border-radius: var(--radius-pill, 999px); background: var(--paper-sunken); font-family: var(--font-mono); color: var(--ink); }
.wc-coin__disc { fill: var(--warning); stroke: var(--ink); stroke-width: 1.5; }
.wc-coin__eye { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.wc-tag { display: inline-block; padding: 1px 10px; color: var(--ink-muted); border: var(--stroke-hair, 1px) solid var(--ink-faint); border-radius: var(--radius-pill, 999px); font-family: var(--font-mono); }

/* LevelRow */
.wc-row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 12px 18px; }
.wc-row__ring { flex: none; }
.wc-row__track { fill: none; stroke: var(--ink-faint); stroke-width: 2; }
.wc-row__bar { fill: none; stroke: var(--primary); stroke-width: 3; stroke-linecap: round; }
.wc-row__count { margin-left: auto; color: var(--ink-muted); }
.wc-row__go { color: var(--ink); }
.wc-row--current { border: var(--stroke-bold, 2px) solid var(--ink); }

/* TabBar */
.wc-tabbar { display: inline-flex; gap: 4px; padding: 8px 10px; border-radius: 28px; }
.wc-tab { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 96px; padding: 8px 12px; border-radius: 22px; color: var(--ink-muted); font-family: var(--font-mono); }
.wc-tab--active { color: var(--ink); background: var(--paper-sunken); }
.wc-tab--active .mono-label { font-weight: 700; }

/* PathNode */
.wc-node { position: relative; display: inline-block; color: var(--ink); line-height: 0; }
.wc-node__svg { display: block; overflow: visible; }
.wc-node__base { fill: var(--ink); stroke: var(--ink); stroke-width: 1.5; }
.wc-node__top { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 1.5; }
.wc-node__icon { color: var(--ink); }
.wc-node__ring { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 6; stroke-linecap: round; }
.wc-node--done .wc-node__top { fill: var(--primary); }
.wc-node--done .wc-node__icon { color: var(--on-primary); }
.wc-node--current .wc-node__top { stroke-width: 2; }
.wc-node--chest .wc-node__top { fill: var(--paper-raised); }
.wc-node--chest .wc-node__icon { color: var(--ink); }
.wc-node--locked .wc-node__top { fill: var(--paper-sunken); stroke: var(--ink-faint); stroke-dasharray: 4 4; }
.wc-node--locked .wc-node__base { fill: var(--paper-sunken); stroke: var(--ink-faint); }
.wc-node--locked .wc-node__icon { color: var(--ink-faint); }
.wc-node__stars { position: absolute; left: 50%; top: calc(100% - 4px); transform: translateX(-50%); display: flex; gap: 2px; padding: 2px 6px; background: var(--paper); border-radius: 10px; line-height: 0; }
.wc-node__tag { position: absolute; left: 50%; bottom: calc(100% - 6px); transform: translateX(-50%); padding: 3px 14px; white-space: nowrap; line-height: 1; color: var(--ink); border-radius: var(--radius-pill, 999px); z-index: 2; }
.wc-node__word { position: absolute; top: 22%; white-space: nowrap; line-height: 1; font-family: var(--font-mono); color: var(--ink); }
.wc-node__word--r { left: calc(100% + 6px); }
.wc-node__word--l { right: calc(100% + 6px); }

/* LevelPath */
.wc-path { position: relative; margin: 0 auto; color: var(--ink); }
.wc-path__trail { position: absolute; inset: 0; overflow: visible; }
.wc-trail { stroke-linecap: round; }
.wc-trail--done { stroke: var(--ink); stroke-width: 2; }
.wc-trail--todo { stroke: var(--ink-faint); stroke-dasharray: 0.1 9; stroke-width: 3; }
.wc-path__item { position: absolute; transform: translate(-50%, -50%); }
.wc-path__doodle { position: absolute; transform: translate(-50%, -50%); color: var(--ink-muted); line-height: 0; }
.wc-banner { position: absolute; left: 12px; right: 12px; top: 0; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-radius: var(--radius-lg, 24px); background: var(--primary); color: var(--on-primary); font-family: var(--font-mono); }
.wc-banner__kicker { color: var(--on-primary); }
.wc-region { position: absolute; left: 0; right: 0; z-index: 6; pointer-events: none; }
.wc-region .wc-banner { position: sticky; top: 8px; left: auto; right: auto; margin: 0 12px; pointer-events: auto; }
.wc-banner__row { display: flex; align-items: baseline; gap: 10px; }

/* Crossword */
.wc-grid { position: relative; display: grid; grid-template-columns: repeat(var(--n), var(--cell)); grid-auto-rows: var(--cell); background: var(--cell-fill); color: var(--ink); }
.wc-grid__lines { position: absolute; left: -3px; top: -3px; pointer-events: none; overflow: visible; }
.wc-grid__lines path { stroke: var(--ink); stroke-width: var(--stroke-hair, 1px); stroke-linecap: square; }
.wc-cell { position: relative; display: flex; align-items: center; justify-content: center; box-sizing: border-box; min-width: 0; }
.wc-cell--block { background: var(--block); }
.wc-cell--word { background: var(--written-wash); }
.wc-cell--active { background: var(--hint); box-shadow: inset 0 0 0 var(--stroke-bold, 2px) var(--ink); }
.wc-cell--correct { background: var(--success-wash); }
.wc-cell--clue { background: var(--clue-cell); flex-direction: column; padding: 2px 3px; text-align: center; }
.wc-cell__letter { font-family: var(--font-letters); }
.wc-cell__clue { color: var(--ink); overflow-wrap: anywhere; font-family: var(--font-mono); }
.wc-cell__arrow { position: absolute; fill: var(--primary); }
.wc-cell__arrow--right { right: 3px; bottom: 3px; }
.wc-cell__arrow--down { right: 3px; bottom: 3px; transform: rotate(90deg); }
.wc-cell__tick { position: absolute; top: 2px; right: 3px; color: var(--success); line-height: 0; }

/* ClueBar */
.wc-clue { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--written-wash); color: var(--ink); font-family: var(--font-mono); }
.wc-clue > .wc-cell__arrow { position: static; flex: none; width: 14px; height: 14px; }
.wc-clue__len { color: var(--ink-muted); font-weight: 400; }
.wc-clue__hints { margin-left: auto; display: flex; gap: 12px; }
.wc-hint { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; }
.wc-hint__t { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
.wc-hint__t .mono-button { font-size: 14px; }
.wc-hint__cost { color: var(--warning-ink); }

/* ResultPopup */
.wc-popup { display: flex; flex-direction: column; align-items: stretch; gap: 16px; width: 330px; padding: 28px 24px 24px; text-align: center; border-radius: 28px; }
.wc-popup__stars { display: flex; justify-content: center; gap: 10px; }
.wc-popup__detail { color: var(--ink-muted); }

/* StatusMessage */
.wc-status { display: flex; align-items: center; gap: 12px; box-sizing: border-box; padding: 12px 16px; border: var(--stroke-hair, 1px) solid; border-radius: var(--radius-md, 16px); color: var(--ink); font-family: var(--font-mono); }
.wc-status--success { background: var(--success-wash); border-color: var(--success); }
.wc-status--warning { background: var(--warning-wash); border-color: var(--warning-ink); }
.wc-status--danger { background: var(--danger-wash); border-color: var(--danger); }

/* OptionRow */
.wc-opt { display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 56px; padding: 10px 16px; background: var(--paper-raised); color: var(--ink); border: var(--stroke-hair, 1px) solid var(--ink-faint); border-radius: var(--radius-md, 16px); font-family: var(--font-mono); cursor: pointer; }
.wc-opt--on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.wc-opt:focus-visible, .wc-toggle:focus-visible { outline: var(--stroke-bold, 2px) solid var(--ink); outline-offset: 2px; }
.wc-opt__code { flex: none; display: grid; place-items: center; width: 34px; height: 34px; box-sizing: border-box; border: var(--stroke-hair, 1px) solid var(--ink-faint); border-radius: 50%; color: var(--ink-muted); font-weight: 700; letter-spacing: 0; }
.wc-opt--on .wc-opt__code { color: var(--ink); border-color: var(--ink); }
.wc-opt__t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wc-opt__sub { color: var(--ink-muted); }
.wc-radio { flex: none; display: grid; place-items: center; width: 22px; height: 22px; box-sizing: border-box; border: var(--stroke-md, 1.5px) solid var(--ink-faint); border-radius: 50%; color: var(--on-primary); }
.wc-opt--on .wc-radio { background: var(--primary); border-color: var(--primary); }

/* PageDots */
.wc-dots { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--radius-pill, 999px); background: var(--paper-sunken); }
.wc-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--ink-faint); }
.wc-dot--on { width: 18px; background: var(--primary); }

/* Segmented */
.wc-seg { display: flex; gap: 2px; padding: 3px; border-radius: var(--radius-pill, 999px); background: var(--paper-sunken); font-family: var(--font-mono); }
.wc-seg__o { flex: 1; text-align: center; padding: 7px 12px; border: var(--stroke-hair, 1px) solid transparent; border-radius: var(--radius-pill, 999px); color: var(--ink-muted); cursor: pointer; white-space: nowrap; }
.wc-seg__o--on { background: var(--paper-raised); border-color: var(--ink-faint); color: var(--ink); font-weight: 700; box-shadow: var(--lift-sm); }

/* Toggle */
.wc-toggle { position: relative; flex: none; width: 46px; height: 28px; box-sizing: border-box; border: var(--stroke-md, 1.5px) solid var(--ink-faint); border-radius: var(--radius-pill, 999px); background: var(--paper-sunken); cursor: pointer; }
.wc-toggle i { position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--ink-faint); transition: transform .15s; }
.wc-toggle--on { background: var(--primary); border-color: var(--primary); }
.wc-toggle--on i { transform: translateX(18px); background: var(--on-primary); }

/* SettingsGroup */
.wc-set { font-family: var(--font-mono); color: var(--ink); }
.wc-set__h { margin: 0 0 8px 4px; color: var(--ink-muted); font-weight: 500; }
.wc-set__card { padding: 0 16px; overflow: hidden; }
.wc-set__row { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 0; }
.wc-set__row + .wc-set__row { border-top: var(--stroke-hair, 1px) solid var(--ink-faint); }
.wc-set__row[data-row] { cursor: pointer; }
.wc-set__row--stack { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 0; }
.wc-set__l { flex: 1; }
.wc-set__v { color: var(--ink-muted); }
.wc-set__row .wc-icon { color: var(--ink-muted); }
.wc-set__n { margin: 8px 4px 0; color: var(--ink-muted); }

/* StatTile */
.wc-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 4px 10px; border-radius: var(--radius-md, 16px); text-align: center; }
.wc-stat__l { color: var(--ink-muted); }

/* ---- Motion: durations, easing and the shared recipes. Calm, short, never decorative. ---- */
:root { --dur-fast: 120ms; --dur-base: 220ms; --dur-slow: 420ms; --dur-celebrate: 700ms; --ease-out: cubic-bezier(.2, .7, .2, 1); --ease-spring: cubic-bezier(.34, 1.56, .64, 1); --ease-in-out: cubic-bezier(.65, 0, .35, 1); }
@keyframes wc-pop { 0% { transform: scale(.55); opacity: 0; } 60% { transform: scale(1.14); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes wc-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes wc-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes wc-shake { 0%, 100% { transform: none; } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes wc-wave { 0%, 100% { transform: none; } 40% { transform: translateY(-5px) scale(1.07); } }
@keyframes wc-draw { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
@keyframes wc-bump { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes wc-flip { from { transform: perspective(700px) rotateX(-70deg); opacity: .2; } to { transform: perspective(700px) rotateX(0); opacity: 1; } }
@keyframes wc-ring { to { stroke-dashoffset: -90; } }
@keyframes wc-popup-in { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }
.wc-anim-pop { animation: wc-pop var(--dur-base) var(--ease-spring) both; }
.wc-anim-enter { animation: wc-rise var(--dur-base) var(--ease-out) both; }
.wc-anim-fade { animation: wc-fade var(--dur-base) var(--ease-out) both; }
.wc-anim-shake { animation: wc-shake 360ms var(--ease-out); }
.wc-anim-wave { animation: wc-wave 440ms var(--ease-out); animation-delay: calc(var(--i, 0) * 70ms); }
.wc-anim-bump { animation: wc-bump 360ms var(--ease-spring); }
.wc-anim-flip { animation: wc-flip var(--dur-slow) var(--ease-out) both; }
.wc-cell--just .wc-cell__tick path { stroke-dasharray: 30; animation: wc-draw 300ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms + 220ms); }
.wc-node__ring { animation: wc-ring 14s linear infinite; }
.wc-popup { animation: wc-popup-in var(--dur-slow) var(--ease-spring) both; }
.wc-popup__stars .wc-star--on { transform-origin: center; animation: wc-pop 460ms var(--ease-spring) both; }
.wc-popup__stars .wc-star:nth-child(1) { animation-delay: 280ms; }
.wc-popup__stars .wc-star:nth-child(2) { animation-delay: 460ms; }
.wc-popup__stars .wc-star:nth-child(3) { animation-delay: 640ms; }
.wc-toggle, .wc-toggle i, .wc-seg__o, .wc-radio, .wc-opt { transition: background-color var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-base) var(--ease-spring); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

.wc-star__shine { stroke: var(--paper-raised); stroke-width: 1.4; fill: none; }
.wc-doodle { color: var(--ink-muted); }

/* LevelRow with flower art */
.wc-row__ringwrap { position: relative; flex: none; width: 48px; height: 48px; }
.wc-row__ringwrap .wc-row__ring { display: block; }
.wc-row__art { position: absolute; inset: 0; display: grid; place-items: center; }
.wc-row__art--dim { opacity: .72; filter: saturate(.75); }
.wc-row__t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wc-row__sub { color: var(--ink-muted); }

/* LevelRow states */
.wc-row__sp { flex: 1; }
.wc-row--done .wc-row__bar { stroke: var(--success); }
.wc-row--done .wc-row__ok { display: inline-flex; align-items: center; gap: 4px; color: var(--success); border-color: var(--success); }
.wc-row--done .wc-row__ok .wc-icon { color: var(--success); }
.wc-row--locked { background: var(--paper); border-style: dashed; }
.wc-row--locked .wc-row__lv, .wc-row--locked .wc-row__sub { color: var(--ink-muted); }

/* BloomCard */
.wc-bloom { display: flex; flex-direction: column; gap: 14px; padding: 18px 18px 16px; }
.wc-bloom__top { display: flex; align-items: center; gap: 14px; }
.wc-bloom__art { position: relative; flex: none; display: grid; place-items: center; width: 108px; height: 108px; border-radius: 50%; background: var(--written-wash); background-clip: content-box; padding: 0; }
.wc-bloom__ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.wc-bloom__trk { fill: none; stroke: var(--paper-sunken); stroke-width: 5; }
.wc-bloom__arc { fill: none; stroke: var(--primary); stroke-width: 5; stroke-linecap: round; transition: stroke-dasharray var(--dur-slow, 420ms) var(--ease-out, ease-out); }
.wc-bloom__art > svg:last-child { position: relative; }
.wc-bloom__t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wc-bloom__k { color: var(--ink-muted); }
.wc-bloom__bar { height: 10px; border-radius: 10px; background: var(--paper-sunken); border: var(--stroke-hair, 1px) solid var(--ink-faint); overflow: hidden; }
.wc-bloom__bar i { display: block; height: 100%; border-radius: 10px; background: var(--primary); transition: width var(--dur-slow, 420ms) var(--ease-out, ease-out); }
.wc-bloom__n { display: flex; justify-content: space-between; gap: 8px; }
.wc-bloom__left { color: var(--ink-muted); }
.wc-bloom__next { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: var(--stroke-hair, 1px) dashed var(--ink-faint); }
.wc-bloom__next .mono-caption:first-child { color: var(--ink-muted); }
.wc-bloom__nt { margin-left: auto; color: var(--ink-muted); }

/* GardenMap */
.wc-garden{position:relative;color:var(--ink);border:var(--stroke-sm,1px) solid var(--ink);border-radius:14px;overflow:hidden;background:var(--paper)}
.wc-garden__svg{display:block;width:100%;height:auto}
.wc-garden__grid{stroke-width:.5;opacity:.18}
.wc-garden__plot--planted svg{transform-box:fill-box;transform-origin:50% 100%;animation:wc-pop var(--dur-slow) var(--ease-spring) both}

/* LevelPath scenery: seeds ahead of the player grow into blooms as nodes are completed */
.wc-path__doodle--seed{opacity:.42;filter:saturate(.6)}
.wc-path__doodle .wc-illo{transform-box:fill-box;transform-origin:50% 100%}

/* SeasonCard */
.wc-seasons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wc-season{display:flex;flex-direction:column;gap:0;padding:0;min-height:0;overflow:hidden;align-items:stretch}
.wc-season__img{position:relative;aspect-ratio:120/76;border-bottom:var(--stroke-hair,1px) solid var(--ink-faint);background:var(--paper-sunken)}
.wc-season__scene{display:block;width:100%;height:100%}
.wc-season .wc-radio{position:absolute;bottom:6px;right:6px;background:var(--paper-raised)}
.wc-season.wc-opt--on .wc-radio{background:var(--primary);border-color:var(--primary)}
.wc-season__t{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}


/* Mascot line: navy on light paper, the lavender of the dark theme on navy paper */
.wc-mascot { color: #000131; }
:root[data-theme="dark"] .wc-mascot { color: #b9a4dc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wc-mascot { color: #b9a4dc; } }

/* Mascot colours: navy line on a sky body in light; white line on a deep indigo body in dark */
.wc-mascot { --mc-line: #000131; --mc-body: #94b7f8; --mc-accent: #44086a; }
:root[data-theme="dark"] .wc-mascot { --mc-line: #c9c7d4; --mc-body: #6a80ba; --mc-accent: #a98fd2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wc-mascot { --mc-line: #c9c7d4; --mc-body: #6a80ba; --mc-accent: #a98fd2; } }

.wc-node__word--top { left: 50%; bottom: calc(100% - 4px); top: auto; transform: translateX(-50%); }
.wc-field { width: 80px; height: 28px; }
.wc-field__bed { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wc-field__bed ellipse { fill: var(--paper-sunken); stroke: var(--ink-faint); stroke-width: 1.2; stroke-dasharray: 3 4; }
.wc-field--done .wc-field__bed ellipse { fill: color-mix(in srgb, var(--warning) 24%, var(--paper)); stroke: var(--ink-muted); stroke-dasharray: none; }
.wc-field--current .wc-field__bed ellipse { stroke: var(--primary); stroke-width: 1.5; }
.wc-field .wc-illo { position: absolute; bottom: 9px; color: var(--ink); }
.wc-field--current .wc-illo { color: var(--primary); }
.wc-field--done .wc-illo { color: var(--ink); }
.wc-field--locked .wc-illo { opacity: .28; color: var(--ink-muted); }

.wc-scene { position: absolute; left: 0; right: 0; }
.wc-scene:first-child { border-radius: var(--radius-lg, 24px) var(--radius-lg, 24px) 0 0; }
.wc-scene:last-of-type { border-bottom-left-radius: var(--radius-lg, 24px); border-bottom-right-radius: var(--radius-lg, 24px); }
.wc-scene--garden { background: color-mix(in srgb, var(--success-wash) 62%, var(--paper)); }
.wc-scene--meadow { background: color-mix(in srgb, #9ad66f 38%, var(--paper)); }
.wc-scene--woodland { background: color-mix(in srgb, #5fa86a 40%, var(--paper)); }
.wc-path__scene { position: absolute; inset: 0; overflow: visible; }
.wc-road { fill: none; }
.wc-road__edge { stroke: var(--ink); stroke-width: 58; stroke-opacity: .85; }
.wc-road__fill { stroke: color-mix(in srgb, var(--warning) 16%, var(--paper-raised)); stroke-width: 55; }
.wc-road--meadow .wc-road__edge { stroke-width: 50; stroke-opacity: .7; }
.wc-road--meadow .wc-road__fill { stroke: color-mix(in srgb, var(--warning) 26%, var(--paper-raised)); stroke-width: 47; }
.wc-road--woodland .wc-road__edge { stroke-width: 60; }

    }
    var rw = t.closest && t.closest('[data-row]');
    if (rw) { var r2 = rw.getAttribute('data-row'); if (r2 === 'intro') { S.screen = 'onb'; S.onb = 0; } else if (r2 === 'time') { S.time = (S.time + 1) % 24; } else { S.pick = r2; S.screen = 'pick'; } render(); return; }
    var fo = t.closest && t.closest('[data-folder]');
    if (fo) { S.folder = fo.getAttribute('data-folder'); S.screen = 'folder'; render(); return; }
    var tab = t.closest && t.closest('.wc-tab');
    if (tab) { var idx = Array.prototype.indexOf.call(tab.parentNode.children, tab); S.tab = TAB_IDS[idx]; render(); return; }
    var item = t.closest && t.closest('.wc-path__item');
    if (item) { nodeTap(Array.prototype.indexOf.call(item.parentNode.querySelectorAll('.wc-path__item'), item)); return; }
    var hb = t.closest && t.closest('.wc-hint');
    if (hb) { hint(Array.prototype.indexOf.call(hb.parentNode.children, hb)); return; }
    var cellEl = t.closest && t.closest('.wc-cell');
    if (cellEl && S.screen === 'puzzle' && !S.popup) {
      var i = Array.prototype.indexOf.call(cellEl.parentNode.children, cellEl);
      selectCell(Math.floor(i / P.p.cols), i % P.p.cols);
    }
  });
  function startCards(from) {
    var q = (from ? inCat(from) : S.learned).slice();
    for (var i = q.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = q[i]; q[i] = q[j]; q[j] = t; }
    S.cards = { queue: q, total: q.length, done: 0, flipped: false, from: from };
    S.screen = 'cards'; render();
  }
  function rate(kind) {
    var D = S.cards; if (!D || !D.queue.length || !D.flipped) return;
    var w = D.queue.shift(), i = ORDER.indexOf(w.cat), msg = null;
    if (kind === 'again') { D.queue.push(w); if (i > 0) { w.cat = ORDER[i - 1]; msg = 'Moved to ' + catName(w.cat); } }
    else { D.done++; if (kind === 'easy' && i < 2) { w.cat = ORDER[i + 1]; msg = 'Moved to ' + catName(w.cat); } }
    D.flipped = false; render(); if (msg) toast('success', msg);
    if (kind === 'easy' && w.cat === 'known' && msg) { /* promoted into Knew it */ }
  }
  function nodeTap(i) {
    var cur = curNode(), n = S.nodes[i];
    if (n.done) { toast('success', 'Already done'); return; }
    if (i !== cur) { toast('warning', 'Finish the earlier stops first'); return; }
    if (n.kind === 'puzzle') startPuzzle(n.puz);
    else if (n.kind === 'chest') { n.done = true; S.coins += 50; render(); toast('success', 'Chest opened: +50 coins'); }
    else toast('warning', 'More puzzles are on the way');
  }
  document.addEventListener('keydown', function (e) {
    if (S.screen === 'cards' && S.cards && !e.ctrlKey && !e.metaKey) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!S.cards.flipped && S.cards.queue.length) { S.cards.flipped = true; FX.flip = true; render(); } return; }
      if (e.key === '1') rate('again'); else if (e.key === '2') rate('good'); else if (e.key === '3') rate('easy');
      return;
    }
    if (S.screen !== 'puzzle' || S.popup || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); move(1); render(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); render(); return; }
    if (e.key.length === 1 && /[a-zA-ZäöüÄÖÜß]/.test(e.key)) { e.preventDefault(); typeLetter(e.key === 'ß' ? 'ß' : e.key.toUpperCase()); }
  });

  /* ---------- theme toggle ---------- */
  function effective() {
    var d = document.documentElement.getAttribute('data-theme');
    if (d === 'dark' || d === 'light') return d;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme() {
    if (S.theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', S.theme);
    bar();
  }
  function bar() {
    $('themebtn').innerHTML = W.Button({ label: effective() === 'dark' ? 'Light theme' : 'Dark theme', variant: 'secondary' });
  }
  $('themebtn').addEventListener('click', function () {
    S.theme = effective() === 'dark' ? 'light' : 'dark'; applyTheme(); if (S.screen === 'home') render();
  });
  window.addEventListener('resize', function () { if (S.screen === 'puzzle') render(); });

  bar(); render();
})();
</script>
