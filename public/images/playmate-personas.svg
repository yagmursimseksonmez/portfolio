<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 860" width="1800" height="860" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1800" height="860" rx="28" fill="#f2f2f2"/>
<rect x="40" y="40" width="844" height="780" rx="24" fill="#fff"/><circle cx="120" cy="126" r="48" fill="#ffd100"/><text x="120" y="144" font-size="48" font-weight="700" fill="#1b1b1b" text-anchor="middle">S</text><text x="192" y="112.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#1b1b1b" text-anchor="start">Summer</text><rect x="194" y="136" width="181" height="34" rx="17" fill="#ffd100"/><text x="284.5" y="158.95" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1b1b1b" text-anchor="middle">Primary persona</text><text x="389" y="157.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5f" text-anchor="start">The social player</text><text x="80" y="228.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5f" text-anchor="start">28 · interior designer · moved to Berlin 6 months ago</text><rect x="80" y="262" width="6" height="104" rx="3" fill="#ffd100"/><text x="106" y="286.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1b1b1b" text-anchor="start">“The sport isn’t the hard part. Meeting</text><text x="106" y="324.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1b1b1b" text-anchor="start">strangers is.”</text><text x="80" y="409.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#5f5f5f" text-anchor="start">Stands for the players who want a circle, not just a workout.</text><text x="80" y="483.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#8a8a8a" text-anchor="start">PAIN POINTS</text><rect x="80" y="510" width="370" height="105.9" rx="12" fill="#f2f2f2"/><text x="98" y="539.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">Can’t tell if a stranger is</text><text x="98" y="566.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">respectful or there to</text><text x="98" y="593.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">dominate</text><rect x="80" y="625.9" width="370" height="78.6" rx="12" fill="#f2f2f2"/><text x="98" y="655.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">Tired of looking for new</text><text x="98" y="682.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">people every time</text><text x="474" y="483.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#8a8a8a" text-anchor="start">NEEDS</text><rect x="474" y="510" width="370" height="78.6" rx="12" fill="#ffd100"/><text x="492" y="539.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">Reviews and commitment</text><text x="492" y="566.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">ratings</text><rect x="474" y="598.6" width="370" height="78.6" rx="12" fill="#ffd100"/><text x="492" y="627.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">Profiles that say why</text><text x="492" y="655.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">someone plays</text><rect x="474" y="687.2" width="370" height="51.3" rx="12" fill="#ffd100"/><text x="492" y="716.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">A favourite playmates list</text><rect x="916" y="40" width="844" height="780" rx="24" fill="#fff"/><circle cx="996" cy="126" r="48" fill="#1b1b1b"/><text x="996" y="144" font-size="48" font-weight="700" fill="#ffd100" text-anchor="middle">L</text><text x="1068" y="112.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#1b1b1b" text-anchor="start">Leo</text><rect x="1070" y="136" width="201" height="34" rx="17" fill="#1b1b1b"/><text x="1170.5" y="158.95" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Secondary persona</text><text x="1285" y="157.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5f" text-anchor="start">The efficiency seeker</text><text x="956" y="228.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#5f5f5f" text-anchor="start">35 · psychologist · Berlin · little free time</text><rect x="956" y="262" width="6" height="104" rx="3" fill="#ffd100"/><text x="982" y="286.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1b1b1b" text-anchor="start">“If the game feels unreliable, I stay</text><text x="982" y="324.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#1b1b1b" text-anchor="start">home.”</text><text x="956" y="409.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#5f5f5f" text-anchor="start">Stands for the players worn down by logistics and cancellations.</text><text x="956" y="483.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#8a8a8a" text-anchor="start">PAIN POINTS</text><rect x="956" y="510" width="370" height="78.6" rx="12" fill="#f2f2f2"/><text x="974" y="539.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">Endless group chat to agree on</text><text x="974" y="566.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">a time</text><rect x="956" y="598.6" width="370" height="78.6" rx="12" fill="#f2f2f2"/><text x="974" y="627.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">Last-minute cancellations and</text><text x="974" y="655.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">skill gaps</text><text x="1350" y="483.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#8a8a8a" text-anchor="start">NEEDS</text><rect x="1350" y="510" width="370" height="78.6" rx="12" fill="#ebebeb"/><text x="1368" y="539.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">Scheduling from poll</text><text x="1368" y="566.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">results</text><rect x="1350" y="598.6" width="370" height="78.6" rx="12" fill="#ebebeb"/><text x="1368" y="627.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">Reliability scores and</text><text x="1368" y="655.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">skill filters</text><rect x="1350" y="687.2" width="370" height="51.3" rx="12" fill="#ebebeb"/><text x="1368" y="716.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#1b1b1b" text-anchor="start">An “I’ll arrive at…” status</text>
</svg>
