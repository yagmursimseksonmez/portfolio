1" font-weight="400" fill="#1b1b1b" text-anchor="start">What makes people stick to a sports routine, compared with</text><text x="1022" y="338.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">doing it alone?</text><rect x="964" y="372.5" width="780" height="82.6" rx="12" fill="#f2f2f2"/><circle cx="994" cy="400.5" r="15" fill="#ffd100"/><text x="994" y="406.5" font-size="17" font-weight="700" fill="#1b1b1b" text-anchor="middle">4</text><text x="1022" y="403.7" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">What profile information (ratings, skill levels) makes a user</text><text x="1022" y="431.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">trust a stranger for a match?</text><rect x="964" y="465.1" width="780" height="82.6" rx="12" fill="#f2f2f2"/><circle cx="994" cy="493.1" r="15" fill="#ffd100"/><text x="994" y="499.1" font-size="17" font-weight="700" fill="#1b1b1b" text-anchor="middle">5</text><text x="1022" y="496.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">What makes someone feel safe meeting a group for the first</text><text x="1022" y="523.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">time?</text><rect x="964" y="557.7" width="780" height="82.6" rx="12" fill="#f2f2f2"/><circle cx="994" cy="585.7" r="15" fill="#ffd100"/><text x="994" y="591.7" font-size="17" font-weight="700" fill="#1b1b1b" text-anchor="middle">6</text><text x="1022" y="588.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">Does a reliability rating or attendance tracking make people</text><text x="1022" y="616.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">more committed to showing up?</text><rect x="964" y="650.3000000000001" width="780" height="82.6" rx="12" fill="#f2f2f2"/><circle cx="994" cy="678.3000000000001" r="15" fill="#ffd100"/><text x="994" y="684.3000000000001" font-size="17" font-weight="700" fill="#1b1b1b" text-anchor="middle">7</text><text x="1022" y="681.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">What happens when a partner cancels, and how can the app soften</text><text x="1022" y="708.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">that?</text>
