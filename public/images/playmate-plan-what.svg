/text><rect x="494" y="40" width="430" height="710.9000000000001" rx="22" fill="#fff"/><circle cx="534" cy="80" r="22" fill="#1b1b1b"/><text x="534" y="88" font-size="22" font-weight="700" fill="#ffd100" text-anchor="middle">2</text><text x="564" y="84.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#1b1b1b" text-anchor="start">Research goals</text><rect x="510" y="122" width="398" height="164.5" rx="12" fill="#f2f2f2"/><circle cx="540" cy="150" r="15" fill="#ffd100"/><text x="540" y="156" font-size="17" font-weight="700" fill="#1b1b1b" text-anchor="middle">1</text><text x="568" y="153.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">Understand what frustrates</text><text x="568" y="180.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">people when they use</text><text x="568" y="207.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">WhatsApp or Facebook to</text><text x="568" y="235.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">organise or join sports</text><text x="568" y="262.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">groups.</text><rect x="510" y="296.5" width="398" height="191.8" rx="12" fill="#f2f2f2"/><circle cx="540" cy="324.5" r="15" fill="#ffd100"/><text x="540" y="330.5" font-size="17" font-weight="700" fill="#1b1b1b" text-anchor="middle">2</text><text x="568" y="327.7" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">Find out which profile</text><text x="568" y="355.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">information (ratings, skill</text><text x="568" y="382.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">levels, mutual friends)</text><text x="568" y="409.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">makes people feel safe</text><text x="568" y="436.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">enough to meet a stranger</text><text x="568" y="464.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">for a game.</text><rect x="510" y="498.3" width="398" height="164.5" rx="12" fill="#f2f2f2"/><circle cx="540" cy="526.3" r="15" fill="#ffd100"/><text x="540" y="532.3" font-size="17" font-weight="700" fill="#1b1b1b" text-anchor="middle">3</text><text x="568" y="529.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">Find out which features</text><text x="568" y="556.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">(accountability scores,</text><text x="568" y="584.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">streaks, social rewards)</text><text x="568" y="611.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">best encourage regular</text><text x="568" y="638.7