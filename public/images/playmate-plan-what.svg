<rect x="40" y="40" width="430" height="710.9000000000001" rx="22" fill="#fff"/><circle cx="80" cy="80" r="22" fill="#1b1b1b"/><text x="80" y="88" font-size="22" font-weight="700" fill="#ffd100" text-anchor="middle">1</text><text x="110" y="84.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#1b1b1b" text-anchor="start">Hypotheses to test</text><rect x="56" y="122" width="398" height="137.2" rx="12" fill="#f2f2f2"/><circle cx="86" cy="150" r="15" fill="#ffd100"/><text x="86" y="156" font-size="17" font-weight="700" fill="#1b1b1b" text-anchor="middle">1</text><text x="114" y="153.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">People exercise more</text><text x="114" y="180.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">regularly when they feel a</text><text x="114" y="207.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">social commitment to a</text><text x="114" y="235.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">group.</text><rect x="56" y="269.2" width="398" height="109.9" rx="12" fill="#f2f2f2"/><circle cx="86" cy="297.2" r="15" fill="#ffd100"/><text x="86" y="303.2" font-size="17" font-weight="700" fill="#1b1b1b" text-anchor="middle">2</text><text x="114" y="300.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">Newcomers hesitate to join</text><text x="114" y="327.7" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1b1b" text-anchor="start">local sports because they</