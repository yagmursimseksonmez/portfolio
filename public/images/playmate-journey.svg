.5" height="96" rx="16" fill="#fff" stroke="#d6d6d6" stroke-width="2"/><text x="1412.5" y="862.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1b1b1b" text-anchor="start">Four ratings · friends</text><path d="M439 476 L816 512 L1194 428 L1571 458" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/><circle cx="438.75" cy="476" r="11" fill="#fff" stroke="#1b1b1b" stroke-width="3"/><text x="438.75" y="513.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5f5f5f" text-anchor="middle">Hopeful, but anxious about who</text><text x="438.75" y="538.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5f5f5f" text-anchor="middle">she’ll meet</text><circle cx="816.25" cy="512" r="11" fill="#e2523b" stroke="#1b1b1b" stroke-width="3"/><text x="816.25" y="549.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5f5f5f" text-anchor="middle">Annoyed by group chat chaos</text><circle cx="1193.75" cy="428" r="11" fill="#ffd100" stroke="#1b1b1b" stroke-width="3"/><text x="1193.75" y="465.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5f5f5f" text-anchor="middle">Relieved it started; curious</text><text x="1193.75" y="490.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5f5f5f" text-anchor="middle">about the others</text><circle cx="1571.25" cy="458" r="11" fill="#fff" stroke="#1b1b1b" stroke-width="3"/><text x="1571.25" y="495.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5f5f5f" text-anchor="middle">Satisfied, but too many rating</text><text x="1571.25" y="520.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#5f5f5f" text-anchor="middle">fields</text>
