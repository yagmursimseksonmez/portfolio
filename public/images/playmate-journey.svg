ans-serif" font-size="21" font-weight="400" fill="#5f5f5f" text-anchor="start">court, reposts if short</text><rect x="639.5" y="650" width="353.5" height="140" rx="16" fill="#ffd100"/><text x="657.5" y="686.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#1b1b1b" text-anchor="start">Automate polls and</text><text x="657.5" y="714.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#1b1b1b" text-anchor="start">arrival updates</text><rect x="639.5" y="830" width="353.5" height="96" rx="16" fill="#fff" stroke="#d6d6d6" stroke-width="2"/><text x="657.5" y="862.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1b1b1b" text-anchor="start">Game room · player limits ·</text><text x="657.5" y="888.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#1b1b1b" text-anchor="start">waitlist</text><rect x="1017" y="40" width="353.5" height="52" rx="26" fill="#1b1b1b"/><text x="1193.75" y="74" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3  The match</text><text x="1017" y="144.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="start">A safe game at the right</text><text x="1017" y="174.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="600" fill="#1b1b1b" text-anchor="start">level</text><text x="1017" y="273.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#5f5f5f" text-anchor="start">Shows up and checks in</text><rect x="1017" y="650" width="353.5" height="140" rx="16" fill="#ffd100"/><text x="1035" y="686.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600