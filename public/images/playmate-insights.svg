<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 940" width="1800" height="940" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1800" height="940" rx="28" fill="#f2f2f2"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="54.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#8a8a8a" text-anchor="start">WHAT I HEARD</text><text x="760" y="54.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#8a8a8a" text-anchor="start">WHAT IT MEANS</text><text x="1180" y="54.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#8a8a8a" text-anchor="start">WHAT I DESIGNED</text><rect x="40" y="84" width="640" height="150.4" rx="18" fill="#fff"/><rect x="62" y="106" width="93" height="34" rx="17" fill="#ffd100"/><text x="108.5" y="129.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#1b1b1b" text-anchor="middle">3 of 4</text><text x="62" y="169.7" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1b1b1b" text-anchor="start">organise games in WhatsApp groups with polls.</text><path d="M694 159.2L746 159.2" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="760" y="148.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">The plan lives in a chat</text><text x="760" y="178.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">nobody can follow.</text><path d="M1106 159.2L1166 159.2" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="1180" y="84" width="580" height="150.4" rx="18" fill="#1b1b1b"/><text x="1204" y="127.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffd100" text-anchor="start">Game rooms</text><text x="1204" y="166.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#e6e6e6" text-anchor="start">Time, place, player limits and cost split in</text><text x="1204" y="194.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#e6e6e6" text-anchor="start">one room.</text><rect x="40" y="250.4" width="640" height="150.4" rx="18" fill="#fff"/><rect x="62" y="272.4" width="93" height="34" rx="17" fill="#ffd100"/><text x="108.5" y="295.7" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#1b1b1b" text-anchor="middle">3 of 4</text><text x="62" y="336.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1b1b1b" text-anchor="start">would rather play with strangers at their</text><text x="62" y="367.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1b1b1b" text-anchor="start">level than with friends at any level.</text><path d="M694 325.6L746 325.6" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="760" y="314.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">Level matters more than</text><text x="760" y="344.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">knowing someone.</text><path d="M1106 325.6L1166 325.6" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="1180" y="250.4" width="580" height="150.4" rx="18" fill="#1b1b1b"/><text x="1204" y="293.7" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffd100" text-anchor="start">Skill levels</text><text x="1204" y="332.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#e6e6e6" text-anchor="start">On every profile and game, and as a filter.</text><rect x="40" y="416.8" width="640" height="150.4" rx="18" fill="#fff"/><rect x="62" y="438.8" width="93" height="34" rx="17" fill="#ffd100"/><text x="108.5" y="462.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#1b1b1b" text-anchor="middle">3 of 4</text><text x="62" y="502.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1b1b1b" text-anchor="start">want a sign of a stranger’s attitude before</text><text x="62" y="533.7" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1b1b1b" text-anchor="start">meeting. “Ego is a red flag.”</text><path d="M694 492L746 492" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="760" y="481.0" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">Trust has to be visible</text><text x="760" y="510.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">before the first game.</text><path d="M1106 492L1166 492" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="1180" y="416.8" width="580" height="150.4" rx="18" fill="#1b1b1b"/><text x="1204" y="460.1" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffd100" text-anchor="start">Peer ratings</text><text x="1204" y="498.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#e6e6e6" text-anchor="start">Reliability, passion, respect and</text><text x="1204" y="527.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#e6e6e6" text-anchor="start">communication, after every game.</text><rect x="40" y="583.2" width="640" height="150.4" rx="18" fill="#fff"/><rect x="62" y="605.2" width="71" height="34" rx="17" fill="#1b1b1b"/><text x="97.5" y="628.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">Mcan</text><text x="62" y="668.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1b1b1b" text-anchor="start">finds a cancelled game disrespectful.</text><path d="M694 658.4000000000001L746 658.4000000000001" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="760" y="647.4" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">A no-show costs the people</text><text x="760" y="677.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">who did show up.</text><path d="M1106 658.4000000000001L1166 658.4000000000001" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="1180" y="583.2" width="580" height="150.4" rx="18" fill="#1b1b1b"/><text x="1204" y="626.5" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffd100" text-anchor="start">Waitlist and no-show penalty</text><text x="1204" y="665.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#e6e6e6" text-anchor="start">The next person fills the spot. A no-show</text><text x="1204" y="693.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#e6e6e6" text-anchor="start">lowers reliability.</text><rect x="40" y="749.6" width="640" height="150.4" rx="18" fill="#fff"/><rect x="62" y="771.6" width="93" height="34" rx="17" fill="#1b1b1b"/><text x="108.5" y="794.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#fff" text-anchor="middle">Andrea</text><text x="62" y="835.3" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#1b1b1b" text-anchor="start">plays with her “favourite playmates”.</text><path d="M694 824.8000000000001L746 824.8000000000001" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="760" y="813.8" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">A good match should be easy</text><text x="760" y="843.7" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="400" fill="#5f5f5f" text-anchor="start">to repeat.</text><path d="M1106 824.8000000000001L1166 824.8000000000001" stroke="#8a8a8a" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="1180" y="749.6" width="580" height="150.4" rx="18" fill="#1b1b1b"/><text x="1204" y="792.9" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffd100" text-anchor="start">Friends and repeat games</text><text x="1204" y="831.6" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#e6e6e6" text-anchor="start">Favourite playmates one tap away. Repeat a</text><text x="1204" y="860.2" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#e6e6e6" text-anchor="start">game every week.</text>
</svg>
